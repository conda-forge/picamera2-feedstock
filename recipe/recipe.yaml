context:
  version: "0.3.39"

package:
  name: picamera2
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/p/picamera2/picamera2-${{ version }}.tar.gz
    sha256: 63edb7898b6b652711b5fc1a2f3d6e075b3f884b2b5e40b05037dbe67a1e49f4

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  noarch: python

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
  run:
    - python >=${{ python_min }}
    - libcamera
    - pidng
    - av
    - jsonschema
    - pykms
    - python-libarchive-c
    - numpy
    - piexif
    - pillow
    - simplejpeg
    - tqdm
    - py-videodev2
    - openexr-python
    - __linux

tests:
  - python:
      imports:
        - picamera2
      # piexif from conda-forge ships wheel tags pip rejects:
      # "piexif 1.1.3 is not supported on this platform"
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script: run_test.py
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/RaspberryPi/picamera2
  repository: https://github.com/RaspberryPi/picamera2
  documentation: https://datasheets.raspberrypi.com/camera/picamera2-manual.pdf
  summary: The libcamera-based Python interface to Raspberry Pi cameras, based on the original Picamera library
  description: |
    Picamera2 is the libcamera-based replacement for Picamera, which was a
    Python interface to the Raspberry Pi's legacy camera stack. It provides
    an easy to use Python API for capturing stills and video, with preview
    windows, encoders and outputs built on top of libcamera.
  license: BSD-2-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - carlodri
